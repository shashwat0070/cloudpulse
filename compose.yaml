services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CLOUDPULSE_DEMO_MODE: "true"
    volumes:
      - cloudpulse-data:/service/.cloudpulse
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  localstack:
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: "${LOCALSTACK_AUTH_TOKEN:?Add your token to .env}"
      SERVICES: sqs,dynamodb
      PERSISTENCE: "1"
      LOCALSTACK_HOST: "localstack:4566"
      SQS_ENDPOINT_STRATEGY: path
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  cloudpulse-data:
  localstack-data: